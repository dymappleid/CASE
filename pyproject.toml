[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "case-stopping"
version = "0.1.0"
description = "CASE: cost-aware stopping for efficient long-video agents"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[tool.setuptools]
packages = ["case_stopping"]
